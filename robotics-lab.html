<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robotics Lab</title><style>.mcap{display:none!important}@media (max-width:560px){.stat .v{font-size:20px!important}.stats{align-items:flex-end}}@media (min-width:561px){.vset{top:4px!important}#stats{top:var(--vset-h,44px)!important}}</style><style>@media (max-width:560px){body > header{display:none}}</style><script>window.FIG_A = () => innerWidth <= 560 ? 1.1 : .75;</script><script>window.LBL_U = () => { if (innerWidth > 560) return 0; const s = document.getElementById("fig"); return s && s.clientWidth && s.viewBox.baseVal.width ? s.viewBox.baseVal.width / s.clientWidth : 0; };</script></head><body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  // on a phone (LBL_U = drawing units per screen px) the pill is a numbered badge and the names go in a legend under the figure
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K, [X,Y] = P(...p3), fs = u ? 10*u : 8.6*k, h = u ? 17*u : fs*1.8, w = u ? h*(n > 9 ? 1.3 : 1) : text.length*fs*.62 + fs*1.5, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? n : text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */

let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

const filterFor = k => `<filter id="hand" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${(0.045/k).toFixed(4)}" numOctaves="2" seed="4" result="warp"/>
  <feDisplacementMap id="wob" in="SourceGraphic" in2="warp" scale="${(2.4*k).toFixed(2)}" xChannelSelector="R" yChannelSelector="G" result="wob"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.9/k).toFixed(4)}" numOctaves="3" seed="11" result="n1"/>
  <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .84  .3 0 0 0 .84  .3 0 0 0 .84  0 0 0 0 1" result="grain"/>
  <feTurbulence type="fractalNoise" baseFrequency="${(0.012/k).toFixed(4)}" numOctaves="2" seed="7" result="n2"/>
  <feColorMatrix in="n2" type="matrix" values=".3 0 0 0 .85  .3 0 0 0 .85  .3 0 0 0 .85  0 0 0 0 1" result="blot"/>
  <feBlend in="wob" in2="grain" mode="multiply" result="g1"/><feBlend in="g1" in2="blot" mode="multiply" result="g2"/>
  <feComposite in="g2" in2="wob" operator="in"/></filter>`;

/* The hand-drawn filter's noise never changes, but browsers recompute every feTurbulence each time the drawing changes
   (on phones SVG filters run on the CPU, so this is most of the cost of a frame). bakeNoise renders each noise layer once
   into an image and swaps it in: coarse layers as one small image over the whole view (they are smooth, so scaling up
   is invisible), fine grain as a seamless tile. If anything fails (an old browser), the live filter simply stays. */
function bakeNoise(svg){
  const fl = document.getElementById('hand'); if (!fl || typeof Image === 'undefined') return;
  const NS = 'http://www.w3.org/2000/svg', vb = svg.viewBox.baseVal;
  const x0 = vb.x - vb.width*.35, y0 = vb.y - vb.height*.35, w0 = vb.width*1.7, h0 = vb.height*1.7;
  for (const t of [...fl.querySelectorAll('feTurbulence')]){
    const fq = parseFloat(t.getAttribute('baseFrequency')), oct = +(t.getAttribute('numOctaves') || 1);
    if (!(fq > 0)) continue;
    const fine = fq * Math.max(w0, h0) > 80;
    if (fine) continue;   // fine grain stays live: a repeated tile leaves faint seams on some GPUs
    const rx = fine ? 0 : x0, ry = fine ? 0 : y0, rw = fine ? 48 / fq : w0, rh = fine ? 48 / fq : h0;
    const ppu = fq * (fine ? 7 : 5) * Math.pow(2, Math.max(0, oct - 1) * .5), PW = Math.ceil(rw * ppu), PH = Math.ceil(rh * ppu);
    if (PW * PH > 1200 * 1200) continue;
    const tb = t.cloneNode(); tb.removeAttribute('result'); if (fine) tb.setAttribute('stitchTiles', 'stitch');
    const src = `<svg xmlns="${NS}" width="${PW}" height="${PH}" viewBox="${rx} ${ry} ${rw} ${rh}"><filter id="n" filterUnits="userSpaceOnUse" x="${rx}" y="${ry}" width="${rw}" height="${rh}" color-interpolation-filters="sRGB">${tb.outerHTML}</filter><rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" filter="url(#n)"/></svg>`;
    const img = new Image();
    img.onload = () => { try {
      const c = document.createElement('canvas'); c.width = PW; c.height = PH; const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      // store the noise's colour values fully opaque: the filter reads its colour channels, and an image with
      // see-through pixels would be read premultiplied (darker) by some browsers
      const px = g.getImageData(0, 0, PW, PH); for (let i = 3; i < px.data.length; i += 4) px.data[i] = 255; g.putImageData(px, 0, 0);
      const url = c.toDataURL('image/png'), res = t.getAttribute('result');
      const im = document.createElementNS(NS, 'feImage');
      // a tile must sit inside the filter's region (the drawing's box) or it gets clipped: anchor it at the drawing's
      // centre, snapped to whole tiles so the grain keeps the same phase as the live noise would
      let ox = rx, oy = ry;
      if (fine){ const bb = svg.getElementById ? document.getElementById('art').getBBox() : { x: 0, y: 0, width: 0, height: 0 };
        ox = Math.floor((bb.x + bb.width/2) / rw) * rw; oy = Math.floor((bb.y + bb.height/2) / rh) * rh; }
      for (const [k, v] of [['x', ox], ['y', oy], ['width', rw], ['height', rh], ['preserveAspectRatio', 'none']]) im.setAttribute(k, v);
      im.setAttribute('href', url); im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
      if (!t.isConnected) return;
      if (fine){ im.setAttribute('result', res + '_tile'); const tl = document.createElementNS(NS, 'feTile'); tl.setAttribute('in', res + '_tile'); tl.setAttribute('result', res); t.replaceWith(im, tl); }
      else { im.setAttribute('result', res); t.replaceWith(im); }
    } catch (e) {} };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
  }
}

// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })

}

<script>
/* ============================================================

const DEG = Math.PI / 180;

/* ---------- oriented primitives (frame T, local coordinates) ---------- */
const axMap = { x: (s,u,v) => [s,u,v], y: (s,u,v) => [u,s,v], z: (s,u,v) => [u,v,s] };

             [[0,0,1], [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]], [[0,0,-1], [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]]];
  let s = '';
  for (const [n, q] of F){ const nw = tVec(T, n); if (!vis(nw)) continue; s += shape(q.map(p => tAp(T, p)), sh(nw, M), w); if (o.deco) s += o.deco(n) || ''; }

// convex profile uv swept along local axis ax from a0 to a1: rounded links, housings, plates

  sbPut(s, obbT(T, mp(Math.min(a0,a1), Math.min(...us), Math.min(...vs)), mp(Math.max(a0,a1), Math.max(...us), Math.max(...vs))), o); return s; }
function qRod(a, b, r, M, o = {}){
  const s = rod(a, b, r, M, o.sh || toneI, o.w ?? 1, o.r1 ?? r, o.n || 18) + (o.deco ? o.deco() : '');
  sbPut(s, obbRod(a, b, Math.max(r, o.r1 ?? r)), o); return s; }
function qCyl(T, ax, c, a0, a1, r, M, o = {}){ const mp = axMap[ax]; return qRod(tAp(T, mp(a0, c[0], c[1])), tAp(T, mp(a1, c[0], c[1])), r, M, o); }
// spur gear: a body with a toothed rim drawn on whichever face looks at the viewer
function qGear(T, ax, c, a0, a1, r, teeth, M, o = {}){
  const mp = axMap[ax], a = tAp(T, mp(a0, c[0], c[1])), b = tAp(T, mp(a1, c[0], c[1])), d = norm(sub(b, a)), end = vis(d) ? b : a;

    pts.push(vAdd(end, vAdd(vSc(U, rr*Math.cos(th)), vSc(V, rr*Math.sin(th))))); }

  const s = rod(a, b, r*1.04, M, toneI, .8, r*1.04, 20) + fill(pd(pts), M.l) + ink(pd(pts), .55) + fill(pd(hub), M.d) + ink(pd(hub), .4);

// a belt hugging two pulleys in one plane (axis = the pulleys' shaft direction)
function qBelt(c1, c2, r1, r2, axis, col = '#2b2724', o = {}){
  const n = norm(axis), U = norm(cross(n, Math.abs(n[2]) < .9 ? [0,0,1] : [1,0,0])), V = cross(n, U);
  const ring = (c, r) => Array.from({length:20}, (_, i) => { const t = i/20*2*Math.PI; return vAdd(c, vAdd(vSc(U, r*Math.cos(t)), vSc(V, r*Math.sin(t)))); });
  const pts = [...ring(c1, r1), ...ring(c2, r2)], h = hull(pts.map(p => [dot(sub(p, c1), U), dot(sub(p, c1), V)]));
  const loop = h.map(([u, v]) => vAdd(c1, vAdd(vSc(U, u), vSc(V, v)))), d = pd(loop), w = o.w || 1.5;
  const s = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(w*.5)}" stroke-linejoin="round"/>`;
  sbPut(s, obbPts(loop, .3), o); return s; }
// coil spring / lead-screw thread between a and b
function qHelix(a, b, r, turns, col = METAL.l, o = {}){
  const d = norm(sub(b, a)), U = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), V = cross(d, U), L = vLen(sub(b, a)), pts = [], n = Math.ceil(turns*14);
  for (let i = 0; i <= n; i++){ const t = i/n, th = t*turns*2*Math.PI; pts.push(vAdd(vAdd(a, vSc(d, L*t)), vAdd(vSc(U, r*Math.cos(th)), vSc(V, r*Math.sin(th))))); }
  const pth = pd(pts, false), w = o.w || 1.1;
  const s = `<path d="${pth}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${pth}" fill="none" stroke="${col}" stroke-width="${f(w*.45)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  sbPut(s, obbRod(a, b, r), o); return s; }
// round each interior corner of a route (a cable bends, it doesn't kink)
const bendPts = (pts, r = 1.2) => { if (pts.length < 3) return pts; const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++){ const [a, b, c] = [pts[i-1], pts[i], pts[i+1]];
    const la = vLen(sub(a, b)), lc = vLen(sub(c, b)), d = Math.min(r, la/2.2, lc/2.2);
    if (d < 1e-3){ out.push(b); continue; }
    const p = vLerp(b, a, d/la), q = vLerp(b, c, d/lc);
    for (let j = 0; j <= 4; j++){ const t = j/4; out.push([0,1,2].map(k => (1-t)*(1-t)*p[k] + 2*(1-t)*t*b[k] + t*t*q[k])); } }
  out.push(pts[pts.length-1]); return out; };
// a cable cut into short pieces, each with its own box, so it sorts behind or in front of the solids it passes
function qWire(pts, col, w = .3, o = {}){ const q = bendPts(pts, o.bend ?? 1.2), Lseg = o.seg || 4;
  for (let i = 0; i < q.length - 1; ){
    let j = i + 1, len = 0; while (j < q.length - 1 && len < Lseg){ len += vLen(sub(q[j], q[j-1])); j++; }
    if (len < Lseg) while (j < q.length - 1) j++;
    const seg = q.slice(i, j + 1), d = pd(seg, false);
    const s = `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + .8)}" stroke-linecap="round" stroke-linejoin="round"/>`
      + `<path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    sbPut(s, obbPts(seg, w), Object.assign({ flat: true }, o)); i = j; } }
// text lying on a face of frame T at local point p; u = reading direction, v = up (both local). Flips u so it never reads mirrored.
function txT(T, p, u, v, str, size, col = INK, weight = 800){
  const o = P(...tAp(T, p)); let U = Dv(...tVec(T, u)), V = Dv(...vSc(tVec(T, v), -1));
  if (U[0]*V[1] - U[1]*V[0] < 0) U = U.map(x => -x);
  if (U[0] < 0){ U = U.map(x => -x); V = V.map(x => -x); }     // turn it the right way up (a rotation, so still not mirrored)
  return `<text transform="${txM(o, U, V)}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; }

// a ball (caster, foot pad, joint marker): shaded circle with a highlight

/* ---------- materials shared by the robots ---------- */
const MOTOR = matOf('#4b5662'), ALU = matOf('#d4d8da'), STEEL = METAL, BRASS = matOf('#d8b25a'), REDUCER = matOf('#a9b1b5');
const PCB = { l:'#4fa36a', m:'#2f8a4a', d:'#1d5f31' }, RUBBER = matOf('#3a3633'), CABLE = { pwr:'#e2483d', sig:'#f4b829', gnd:'#3a3633', enc:'#4f86c6', air:'#5aa6d6' };

/* ---------- compose: assembly filter, x-ray covers, highlights, sorting ---------- */
function partShown(st, R, p){ const i = R._step[p]; return i == null || i < st.built; }
function compose(st, R){
  const k = ease(st.xr || 0), sel = st.sel, act = R.active ? R.active(st) : {}, groups = {}, nodes = [];
  const lift = Dv(0, 0, 26*(1 - ease(Math.min(1, st.pt ?? 1))));
  for (const it of SB.items){ if (it.p && !partShown(st, R, it.p)) continue;
    const anim = it.p && R._step[it.p] === st.built - 1 && st.pt < 1;
    let s = it.svg; const cls = (sel && it.p === sel) || anim ? 'hl' : act[it.p] ? 'on' : '';
    if (anim) s = `<g transform="translate(${f(lift[0])} ${f(lift[1])})" opacity="${f(Math.min(1, .15 + st.pt*1.5))}">${s}</g>`;
    s = `<g data-p="${it.p || ''}"${cls ? ` class="${cls}"` : ''}>${s}</g>`;
    if (it.g && SB.groups[it.g]){ const G = groups[it.g] || (groups[it.g] = { inner: [], cov: [] }); G[it.cover ? 'cov' : 'inner'].push({ obb: it.obb, svg: s }); }
    else nodes.push({ obb: it.obb, svg: s }); }
  for (const [g, v] of Object.entries(groups)){
    let s = dsort(v.inner);
    if (v.cov.length) s += `<g opacity="${f(1 - .84*k)}"${k > .5 ? ' pointer-events="none"' : ''}>${dsort(v.cov)}</g>`;
    nodes.push({ obb: SB.groups[g], svg: s }); }
  return dsort(nodes); }
// one cast shadow per object: every built solid of the robot goes into one hull; props (part.shadow) and part-less world
// items (obstacles) get their own
function shadowsOf(st, R, z0 = 0, clip = null){ const sets = {}; let s = '';
  SB.items.forEach((it, i) => { if (it.flat || (it.p && !partShown(st, R, it.p))) return; if (Math.max(...it.obb.h) < .7) return;
    const key = !it.p ? 'w' + i : (R.parts[it.p] && R.parts[it.p].shadow) || 'main'; (sets[key] = sets[key] || []).push(...obbCorners(it.obb)); });
  for (const pts of Object.values(sets)) s += castShadow(pts, z0);
  return clip ? clipTo(clip, s) : s; }
function labelsSVG(st, R){
  if (!document.getElementById('fig') || document.documentElement.classList.contains('nolabels')) return '';

  for (const [p, d] of Object.entries(R.parts)){
    if (!d.lbl || !SB.anchor[p] || !partShown(st, R, p)) continue;

/* ---------- overlays ---------- */
function crashBurst(p, t){ const q = P(...p), r = (4 + 5*(1 - t))*INK_K*3, pts = [];

const trailSVG = (pts, col = '#e2483d', w = 1.1, dash = '') => pts.length > 1 ? `<path d="${pd(pts, false)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${dash ? `stroke-dasharray="${dash}"` : ''} opacity=".85" pointer-events="none"/>` : '';
// the drag handle on a tool tip: a ring with a cross, plus a plumb line to the floor so height reads
function tipHandle(p, z0, on){ const q = P(...p), g = P(p[0], p[1], z0), r = 5*INK_K*1.6;
  return `<path d="M${f(q[0])} ${f(q[1])}L${f(g[0])} ${f(g[1])}" stroke="${INK}" stroke-width=".7" stroke-dasharray="1.5 1.5" fill="none" pointer-events="none"/>`
    + `<ellipse cx="${f(g[0])}" cy="${f(g[1])}" rx="${f(r*.6)}" ry="${f(r*.3)}" fill="none" stroke="${INK}" stroke-width=".7" pointer-events="none"/>`
    + act('tip', `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(r*1.9)}" fill="#fff" fill-opacity=".01"/><circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(r)}" fill="${on ? '#e2483d' : 'var(--accent,#f4b829)'}" fill-opacity=".35" stroke="${on ? '#e2483d' : INK}" stroke-width="1.3"/>`
      + `<path d="M${f(q[0]-r*1.5)} ${f(q[1])}H${f(q[0]+r*1.5)}M${f(q[0])} ${f(q[1]-r*1.5)}V${f(q[1]+r*1.5)}" stroke="${INK}" stroke-width=".9"/>`); }
// screen point (viewBox units) -> point on the plane z = z0 in scene coordinates
function screenToPlane(X, Y, z0){ const o = P(0, 0, z0), a = Dv(1,0,0), b = Dv(0,1,0), det = a[0]*b[1] - a[1]*b[0];

const dragWorld = (dx, dy) => vAdd(vSc(CAM_R, dx/CAM_K), vSc(CAM_D, dy/CAM_K));

function dragPlane(dx, dy){ const a = Dv(1,0,0), b = Dv(0,1,0), det = a[0]*b[1] - a[1]*b[0]; if (Math.abs(det) < .05) return [0, 0];

// floor disc with a grid that scrolls with the robot's world position (follow camera)
function floorDisc(cx, cy, R0, ox, oy, sp = 10){
  const rim = on(PZ(0), ellUV(cx, cy, R0, R0, 64)), rimB = on(PZ(-1.2), ellUV(cx, cy, R0, R0, 64));

function mountLab(R){

  let lastFlash = 0, lastMsg = '';

    kick(){ if (st.loop) return; st.loop = true; ui.animate(dt => { const more = st.mode === "op" && !!R.tick(st, dt, ui, lab); if (!more) st.loop = false; return more; }); },
    flash(msg, ms = 1700){ const t = performance.now(); if (msg === lastMsg && t - lastFlash < 1200) return; lastMsg = msg; lastFlash = t; ui.flash(msg, ms); },

  const place = () => { st.built++; st.pt = 0; const step = R.steps[st.built - 1]; st.sel = step.parts[0];

    scene: (st, m) => labScene(st, m, R),

      { label: 'Back', onClick: (st) => { if (st.mode === 'op'){ st.mode = 'build'; return; } if (!st.built) return lab.flash('Nothing placed yet');
          st.built--; st.pt = 1; st.sel = st.built ? R.steps[st.built - 1].parts[0] : null; } },
      { label: 'Build all', onClick: (st) => { if (st.built >= N) return lab.flash('Already fully built');

  addEventListener('pointermove', e => { if (!drag) return; const p = vbPt(e); R.onDrag(st, p[0] - drag.last[0], p[1] - drag.last[1], 'move', lab); drag.last = p; lab.kick(); ui.invalidate(); });

const slHTML = (id, label, min, max, step, unit, tip = '') => `<div class="sl" id="w_${id}"><div class="slh"><span title="${tip}">${label}</span><b id="v_${id}"></b></div><input type="range" id="s_${id}" min="${min}" max="${max}" step="${step}" aria-label="${label}"><div class="rng"><span>${min}${unit}</span><span>${max}${unit}</span></div></div>`;
function slSync(id, v, txt, atLim){ const s = document.getElementById('s_' + id); if (!s) return; if (document.activeElement !== s) s.value = v;
  document.getElementById('v_' + id).textContent = txt; document.getElementById('w_' + id).classList.toggle('lim', !!atLim); }
// virtual joystick: writes st.joy = [x (right), y (up)] in -1..1, springs back on release; WASD / arrows drive it too
function joyBind(el, st, lab){
  const knob = el.querySelector('i'); let id = null;
  const set = (x, y) => { const l = Math.hypot(x, y); if (l > 1){ x /= l; y /= l; } st.joy = [x, y]; knob.style.left = (50 + x*36) + '%'; knob.style.top = (50 - y*36) + '%'; lab.kick(); };
  const fromE = e => { const r = el.getBoundingClientRect(); set((e.clientX - r.left - r.width/2) / (r.width*.36), -(e.clientY - r.top - r.height/2) / (r.height*.36)); };
  el.addEventListener('pointerdown', e => { id = e.pointerId; el.setPointerCapture(id); fromE(e); e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) fromE(e); });
  const up = e => { if (e.pointerId !== id) return; id = null; set(0, 0); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  const keys = new Set(), map = { w:[0,1], s:[0,-1], a:[-1,0], d:[1,0], ArrowUp:[0,1], ArrowDown:[0,-1], ArrowLeft:[-1,0], ArrowRight:[1,0] };
  const kset = () => { let x = 0, y = 0; for (const k of keys){ x += map[k][0]; y += map[k][1]; } set(x, y); };
  addEventListener('keydown', e => { if (!map[e.key] || st.mode !== 'op' || /input|textarea/i.test(e.target.tagName)) return; e.preventDefault(); e.stopImmediatePropagation(); keys.add(e.key); kset(); }, true);
  addEventListener('keyup', e => { if (!map[e.key]) return; keys.delete(e.key); kset(); }, true);
}

function thumbSVG(R, i){
  R._step = {}; R.steps.forEach((s, j) => s.parts.forEach(p => R._step[p] = j));
  const st = Object.assign({ mode:'build', built:R.steps.length, pt:1, sel:null, xr:0 }, R.init(), R.thumbState || {});
  CAM_LIM = null; setCam(YAW0 + (R.thumbYaw || 0), PITCH0 + (R.thumbPitch || 0)); setLight(105);
  const [W, D, H] = R.size; RC = R.center || [W/2, D/2]; RCZ = H/2; OX = OY = 0;
  const pts = []; for (const x of [0, W]) for (const y of [0, D]) for (const z of [0, H]) pts.push(P(x, y, z));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
  const vbW = Math.max(bw/.9, bh/.9/.78), vbH = vbW*.78;
  OX = (vbW - bw)/2 - Math.min(...xs); OY = (vbH - bh)/2 - Math.min(...ys);
  INK_K = vbW / INK_REF_VB;
  const body = inkScale(labScene(st, PALS[R.pal], R)).replace(/clip-path="url\(#/g, 'clip-path="url(#').trim();
  return `<svg viewBox="0 0 ${f(vbW)} ${f(vbH)}" role="img" aria-label="${R.name}"><defs>${filterFor(INK_K).replace('id="hand"', `id="hand${i}"`).replace('id="wob"', '')}</defs><g filter="url(#hand${i})">${body}</g></svg>`;
}

}
const HUB_GLOSSARY = [
  ['Servo motor', 'A motor plus a position sensor plus a control loop. You command an angle; it measures where it is and drives until the error is zero. Industrial servos are brushless AC motors with high-resolution encoders; hobby servos hide a DC motor, gears and a potentiometer in one plastic case.'],
  ['Stepper motor', 'Moves in fixed steps (usually 200 per turn) as its coils are switched in sequence. No sensor needed for position, which is why CNC machines and 3D printers use them, but if it is overloaded it silently skips steps.'],
  ['Encoder', 'Counts rotation. An optical or magnetic disc with fine marks passes a sensor; quadrature (two channels 90 degrees apart) gives direction. Absolute encoders remember position through a power cut.'],
  ['Gear reduction', 'Trades speed for torque. A 100:1 reducer makes the joint turn 100 times slower than the motor and up to 100 times stronger (minus friction). Strain wave (harmonic) and cycloidal (RV) reducers give big ratios with almost no backlash.'],
  ['Motor driver', 'The power stage between the low-power controller and the motor: H-bridges for DC motors, step/direction drivers for steppers, three-phase inverters for brushless servos. It turns logic signals into amps.'],
  ['Kinematics', 'Forward kinematics: from joint angles, where is the tool? Inverse kinematics: for a wanted tool position, which joint angles? IK can have several answers (elbow up or down) or none (out of reach).'],
];

/* ============================================================
   Robot 01 — six-axis industrial arm (a small 5 kg-class arm, ~70 cm reach). 1 unit = 1 cm.
   Truth (how a real one is built):
   - Base flange bolted to the plate. Inside the base housing a J1 AC servo drives a ring gear through a pinion; the ring
     gear is the input of an RV (cycloidal) reducer whose output is the turret, carried on a cross-roller bearing.
   - The turret carries the J2 housing (RV reducer + servo + brake + encoder) on one side and the upper arm on the other.
   - The upper arm carries the J3 housing (harmonic drive + servo) on its far end; the forearm turns on it.
   - The forearm's rear houses three small servos for J4/J5/J6. J4 turns a hollow torque tube by a gear pair; J5 and J6
     drive concentric shafts inside it by timing belts; at the wrist a bevel gear turns the J5 drive 90 degrees.
   - The harness enters at the base connector, runs up the hollow J1 axis, through the turret and inside the arm castings.
   - A controller cabinet holds the servo amplifiers; a teach pendant on a cable lets a person jog and record poses.
   Parts: flange, anchors | j1motor, j1gear, j1rv, bearing | drum | turret | j2rv, j2motor, j2housing | ua |
          j3hd, j3motor, j3housing | fa | wmotors, wgears, belts, tube | wrist, bevel, flange6 | harness, conn | ctrl, pendant |
          gripper, fingers, hoses | block
   ============================================================ */
const A6 = { BX: 44, BY: 34, ZS: 30, L2: 30, L3: 26, WX: 3.2, FL: 4, TL: 8.3 };
A6.LF = A6.L3 + A6.WX; A6.DT = A6.FL + A6.TL;
const A6_LIM = [[-170,170],[-40,100],[-75,150],[-180,180],[-120,120],[-270,270]];
const A6_VMAX = [90, 80, 100, 220, 220, 320];
const A6_RATIO = [121, 121, 101, 81, 81, 50];
const A6_NAMES = ['J1 base', 'J2 shoulder', 'J3 elbow', 'J4 wrist roll', 'J5 wrist bend', 'J6 flange'];
const A6_HOME = [0, 0, 0, 0, 90, 0];
const A6_BLOCK0 = [66, 20];

function a6FK(q){
  const T1 = tMul(tTr(A6.BX, A6.BY, 14), tRz(q[0]*DEG));
  const a2 = (90 - q[1])*DEG, b = (q[2] - q[1])*DEG;
  const T2 = tCat(T1, tTr(0, 0, A6.ZS - 14), tRy(-a2));
  const T3 = tCat(T2, tTr(A6.L2, 0, 0), tRy(-(b - a2)));
  const T4 = tCat(T3, tTr(A6.L3, 0, 0), tRx(q[3]*DEG));
  const T5 = tCat(T4, tTr(A6.WX, 0, 0), tRy(q[4]*DEG));
  const T6 = tCat(T5, tTr(A6.FL, 0, 0), tRx(q[5]*DEG));
  return { T1, T2, T3, T4, T5, T6, S: tAp(T2, [0,0,0]), E: tAp(T3, [0,0,0]), W: tAp(T5, [0,0,0]), tip: tAp(T6, [A6.TL, 0, 0]) };
}
// inverse kinematics, tool pointing straight down, J4 = 0, elbow up
function a6IK(p, q6){
  const W = [p[0], p[1], p[2] + A6.DT], dx = W[0] - A6.BX, dy = W[1] - A6.BY, rr = Math.hypot(dx, dy), h = W[2] - A6.ZS, D = Math.hypot(rr, h);
  if (D > A6.L2 + A6.LF - .05) return { err: 'Out of reach: the arm is fully stretched' };
  if (D < Math.abs(A6.L2 - A6.LF) + 1) return { err: 'Too close to the shoulder' };
  const a2 = Math.atan2(h, rr) + Math.acos(clamp((A6.L2**2 + D*D - A6.LF**2) / (2*A6.L2*D), -1, 1));
  const b = Math.atan2(h - A6.L2*Math.sin(a2), rr - A6.L2*Math.cos(a2));
  const q2 = 90 - a2/DEG, q = [Math.atan2(dy, dx)/DEG, q2, b/DEG + q2, 0, b/DEG + 90, q6];
  for (let i = 0; i < 6; i++) if (q[i] < A6_LIM[i][0] - 1e-6 || q[i] > A6_LIM[i][1] + 1e-6) return { err: `${A6_NAMES[i]} would pass its limit (${A6_LIM[i][q[i] < 0 ? 0 : 1]} deg)`, q };
  return { q };
}
function a6Check(q){
  const F = a6FK(q), g = [];
  for (const sx of [.8, 4.6, 8.6]) for (const sy of [-3.6, 3.6]) for (const sz of [-2, 2]) g.push(tAp(F.T6, [sx, sy, sz]));
  const pts = [['elbow', F.E, 5.5], ['wrist', F.W, 3.4], ['tool tip', F.tip, .3], ...g.map(p => ['gripper', p, 0])];
  for (const [nm, p, r] of pts){
    if (p[2] - r < 3.2) return { why: `Crash: the ${nm} hit the table`, at: [p[0], p[1], 3.2] };
    const rb = Math.hypot(p[0] - A6.BX, p[1] - A6.BY);
    if (nm !== 'elbow' && rb < 12.5 + r && p[2] < 15) return { why: 'Self-collision: the tool hit the base housing', at: p };
    if (nm !== 'elbow' && rb < 9 + r && p[2] < 36) return { why: 'Self-collision: the tool hit the turret', at: p };
    if (p[0] > 4 && p[0] < 20 && p[1] > 51 && p[1] < 68 && p[2] < 25) return { why: 'Crash: the arm ran into the controller cabinet', at: p };
  }
  return null;
}
// gravity torque about a joint axis (N m): sum of (r x F) . axis, positions in cm
function a6Torques(q, payload){
  const F = a6FK(q), g = 9.81, at = (T, x) => tAp(T, [x, 0, 0]);
  const masses = [[at(F.T2, A6.L2/2), 5.5, 2], [F.E, 2.2, 3], [at(F.T3, A6.L3*.4), 3.2, 3], [F.W, 1.1, 5], [at(F.T6, 3), .9, 5], [F.tip, payload, 5]];
  const tq = (o, ax, from) => masses.filter(m => m[2] >= from).reduce((s, [p, m]) => s + dot(cross(vSc(sub(p, o), .01), [0, 0, -m*g]), ax), 0);
  return [Math.abs(tq(F.S, tAx(F.T2, 1), 2)), Math.abs(tq(F.E, tAx(F.T3, 1), 3)), Math.abs(tq(F.W, tAx(F.T5, 1), 5))];
}

function a6Tick(st, dt, ui, lab){
  let moving = false; const nq = st.q.slice();
  for (let i = 0; i < 6; i++){ const d = st.qt[i] - st.q[i]; if (Math.abs(d) > 1e-4){ nq[i] += Math.sign(d)*Math.min(Math.abs(d), A6_VMAX[i]*st.speed*dt); moving = true; } }
  if (moving){ const c = a6Check(nq);
    if (c){ st.qt = st.q.slice(); st.qd = [0,0,0,0,0,0]; st.crash = { at: c.at, t: 1 }; st.crashes++; st.play = false; lab.flash(c.why + ' — motion stopped'); }
    else { st.qd = nq.map((v, i) => (v - st.q[i]) / Math.max(dt, 1e-3)); st.q = nq;
      const tp = a6FK(st.q).tip; const last = st.trail[st.trail.length - 1]; if (!last || vLen(sub(tp, last)) > .6){ st.trail.push(tp); if (st.trail.length > 400) st.trail.shift(); } } }
  else st.qd = [0,0,0,0,0,0];
  // gripper jaws
  const gd = st.gripT - st.grip; if (Math.abs(gd) > 1e-3){ st.grip += Math.sign(gd)*Math.min(Math.abs(gd), 6*dt); moving = true;
    if (st.gripT < 1 && st.grip <= 1.65 && !st.carry){ const tp = a6FK(st.q).tip; if (vLen(sub(vAdd(tp, [0, 0, -1.6]), st.blockAt)) < 2.2){ st.carry = true; st.gripT = st.grip = 1.6; lab.flash('Gripped the block'); } } }
  // playback of taught poses
  if (st.play && !moving){ if (st.hold > 0) st.hold -= dt; else { st.pi = (st.pi + 1) % st.poses.length; const pz = st.poses[st.pi]; st.qt = pz.q.slice(); st.gripT = pz.g; st.hold = .35; } moving = true; }
  if (st.crash){ st.crash.t -= dt/1.2; if (st.crash.t <= 0) st.crash = null; else moving = true; }
  return moving || st.dragging;
}

/* ============================================================
   Robot 02 — SCARA arm (Selective Compliance Assembly Robot Arm), 400 mm reach. 1 unit = 1 cm.
   Truth: a pedestal holds the J1 servo and harmonic drive (and, in compact SCARAs, the servo amplifiers). Link 1 swings
   about J1; at its tip the J2 servo + harmonic drive swing link 2. Link 2 carries two motors: the Z motor turns a ball-screw
   nut by a belt (the quill moves up and down), the R motor turns a ball-spline nut by a second belt (the quill rotates).
   Both nuts ride one combined ball-screw/spline shaft: the quill. A vacuum cup on its end picks parts. A cable duct arcs
   from the pedestal top to link 2. The arm is stiff vertically and compliant sideways: ideal for pressing parts in.
   Parts: pedestal | j1motor, j1hd, amps, psu | j1out | link1 | j2motor, j2hd | link2 | zmotor, zbelt, rmotor, rbelt, nut |
          quill | cup | duct | tray, pucks
   ============================================================ */
const SC = { BX: 16, BY: 38, L1: 22, L2: 18 };
const SC_LIM = [[-130, 130], [-145, 145], [.4, 16], [-360, 360]];
const SC_VMAX = [180, 220, 30, 360];
const SC_NAMES = ['J1 shoulder', 'J2 elbow', 'Z quill height', 'R quill roll'];
const SC_HOME = [-20, 60, 10, 0];
const SC_FEED = [[44, 22], [48, 30], [40, 15]];
const SC_TRAY = [[37, 55], [43, 55], [40, 61]];
const SC_PUCKC = ['#e2483d', '#5a82c6', '#43c25c'];

function scFK(q){ const A = tMul(tTr(SC.BX, SC.BY, 33), tRz(q[0]*DEG)), B = tCat(A, tTr(SC.L1, 0, 6), tRz(q[1]*DEG)), Q = tAp(B, [SC.L2, 0, 0]);
  return { A, B, E: tAp(A, [SC.L1, 0, 0]), tip: [Q[0], Q[1], 3 + q[2]] }; }
function scIK(x, y, cfg){ const dx = x - SC.BX, dy = y - SC.BY, c2 = (dx*dx + dy*dy - SC.L1**2 - SC.L2**2) / (2*SC.L1*SC.L2);
  if (c2 > 1) return { err: 'Out of reach: both links are in a straight line' }; if (c2 < -1) return { err: 'Too close to the column' };
  const q2 = cfg*Math.acos(c2), q1 = Math.atan2(dy, dx) - Math.atan2(SC.L2*Math.sin(q2), SC.L1 + SC.L2*Math.cos(q2)), q = [wrap180(q1/DEG), q2/DEG];
  for (let i = 0; i < 2; i++) if (q[i] < SC_LIM[i][0] || q[i] > SC_LIM[i][1]) return { err: `${SC_NAMES[i]} would pass its limit (${SC_LIM[i][q[i] < 0 ? 0 : 1]} deg)`, q };
  return { q }; }
function scCheck(st, q){ const F = scFK(q), t = F.tip;
  if (Math.abs(t[0] - SC.BX) < 10.5 && Math.abs(t[1] - SC.BY) < 10.5) return { why: 'Self-collision: the quill hit the pedestal', at: [t[0], t[1], 20] };
  const held = st.pucks.find(p => p.held);
  if (held && q[2] < 1.6 - .01 && !inTray(t)) return { why: 'Crash: the part being carried hit the table', at: [t[0], t[1], 3.4] };
  if (held && q[2] < 2.2 - .01 && inTray(t)) return { why: 'Crash: the part hit the tray', at: [t[0], t[1], 4] };
  for (const p of st.pucks) if (!p.held && Math.hypot(p.x - t[0], p.y - t[1]) < 2.8 && q[2] < p.z + 1.6 - .01) return { why: 'Crash: the vacuum cup pressed into a part', at: [t[0], t[1], 3 + p.z + 1.6] };
  if (!held && inTray(t) && q[2] < .6) return { why: 'Crash: the cup hit the tray', at: [t[0], t[1], 3.6] };
  return null; }
const inTray = t => t[0] > 33 && t[0] < 47 && t[1] > 51 && t[1] < 65;
const SC_WS = (() => { const out = []; for (let a = -130; a <= 130; a += 13) for (let b = -145; b <= 145; b += 14.5){ const A = a*DEG, B = (a + b)*DEG;
  out.push([SC.BX + SC.L1*Math.cos(A) + SC.L2*Math.cos(B), SC.BY + SC.L1*Math.sin(A) + SC.L2*Math.sin(B)]); } return out; })();

function scDraw(st, m){

function scTick(st, dt, ui, lab){
  let moving = false; const nq = st.q.slice();
  for (let i = 0; i < 4; i++){ const d = st.qt[i] - st.q[i]; if (Math.abs(d) > 1e-4){ nq[i] += Math.sign(d)*Math.min(Math.abs(d), SC_VMAX[i]*st.speed*dt); moving = true; } }
  if (moving){ const c = scCheck(st, nq);
    if (c){ st.qt = st.q.slice(); st.qd = [0,0,0,0]; st.prog = []; st.crash = { at: c.at, t: 1 }; st.crashes++; lab.flash(c.why + ' — motion stopped'); }
    else { st.qd = nq.map((v, i) => (v - st.q[i]) / Math.max(dt, 1e-3)); st.q = nq; const tp = scFK(st.q).tip, l = st.trail[st.trail.length - 1];
      if (!l || Math.hypot(tp[0] - l[0], tp[1] - l[1]) > .5){ st.trail.push(tp); if (st.trail.length > 400) st.trail.shift(); } } }
  else st.qd = [0,0,0,0];
  if (st.prog.length){ st.cycle += dt;
    if (!moving){ const s = st.prog[0];
      if (!s.started){ s.started = true; let r = scIK(s.x, s.y, st.cfg);
        if (r.err){ const r2 = scIK(s.x, s.y, -st.cfg); if (!r2.err){ r = r2; st.cfg = -st.cfg; } }
        if (r.err){ st.prog = []; lab.flash(r.err); } else st.qt = [r.q[0], r.q[1], s.z, 0]; moving = true; }
      else { if (s.vac != null) setVac(st, s.vac, lab); st.prog.shift(); if (!st.prog.length){ st.cycles++; st.lastCycle = st.cycle; } moving = true; } }
    else moving = true; }
  if (st.crash){ st.crash.t -= dt/1.2; if (st.crash.t <= 0) st.crash = null; else moving = true; }
  return moving || st.dragging;
}
function setVac(st, on, lab){ st.vac = on; const t = scFK(st.q).tip;
  if (on){ const p = st.pucks.find(p => !p.held && Math.hypot(p.x - t[0], p.y - t[1]) < 2 && Math.abs(st.q[2] - (p.z + 1.6)) < .4);
    if (p){ p.held = true; lab.flash('Vacuum on: part picked'); } else lab.flash('Vacuum on — nothing under the cup'); }
  else { const p = st.pucks.find(p => p.held); if (p){ p.held = false; p.x = t[0]; p.y = t[1]; p.z = st.q[2] - 1.6; } } }
function scPickPlace(st, lab){
  if (st.prog.length) return lab.flash('Already running a cycle');
  if (st.pucks.some(p => p.held)) return lab.flash('Drop the part first (Vacuum off)');
  const i = st.pucks.findIndex(p => !inTray([p.x, p.y]));
  if (i < 0) return lab.flash('All parts are in the tray — press Reset parts');
  const p = st.pucks[i], dst = SC_TRAY.find(d => !st.pucks.some(u => Math.hypot(u.x - d[0], u.y - d[1]) < 3));
  st.cycle = 0; st.prog = [{ x: p.x, y: p.y, z: 8 }, { x: p.x, y: p.y, z: p.z + 1.6, vac: true }, { x: p.x, y: p.y, z: 8 }, { x: dst[0], y: dst[1], z: 8 }, { x: dst[0], y: dst[1], z: 2.2, vac: false }, { x: dst[0], y: dst[1], z: 10 }]; }

   Steering is done only by wheel speed difference: v = (vR + vL)/2, omega = (vR - vL)/track.
   Parts: plate | motors, encoders | wheels | caster | battery | driver | mcu, imu | wires | bumper | shell | lidar

const RV = { C: 35, R0: 33, TRACK: 24.6, RW: 4.5, RW_R: 4.43, VMAX: 70, WMAX: 2.4, TPR: 1632 };
const RV_OBST = [

  { x: 24, y: 52, w: 9, d: 22, h: 20, c: '#71b693' }, { x: -38, y: -32, w: 12, d: 12, h: 24, c: '#5a82c6' },
  { x: 80, y: 40, w: 10, d: 30, h: 20, c: '#d8869c' }, { x: 10, y: -55, w: 32, d: 7, h: 20, c: '#d49c1f' },
  { x: -70, y: 0, w: 8, d: 40, h: 22, c: '#71b693' }, { x: 40, y: -70, w: 14, d: 14, h: 20, c: '#cf5038' } ];

const rvScene = (st, w) => [RV.C + w[0] - st.pos[0], RV.C + w[1] - st.pos[1]];

function rvTick(st, dt, ui, lab){

/* ============================================================
   Robot 04 — hexapod walker (18 hobby servos, ~45 cm across). 1 unit = 1 cm.
   Truth: two plates sandwich six coxa servos (vertical axes) on standoffs, with the battery, a 5-6 V regulator (UBEC),
   a 32-channel servo controller, a small computer and an IMU between them. Each coxa servo horn carries a U-bracket with
   the femur servo (horizontal axis); the femur is a pair of side plates ending at the knee servo; the tibia hangs from the
   knee horn and ends in a rubber foot. Each leg = 3 DOF, so the foot can be put anywhere in a volume; the body stays level
   while stance feet stay planted on the ground and swing feet arc forward.
   Parts: plates | battery, ubec | ctrlb, sbc, imu | coxaS | cbr, femurS | femur, tibiaS | tibia, foot | leads | top | head
   ============================================================ */
const HX = { C: 40, R0: 38, COXA: 4.4, FEM: 7.5, TIB: 11, MASS: 2.0, VMAX: 9, WMAX: .55, LIFT: 3.2 };
const HX_LEGS = [ { n: 'LF', m: [9.6, 5.8], a: 40 }, { n: 'LM', m: [0, 8.6], a: 90 }, { n: 'LR', m: [-9.6, 5.8], a: 140 },
                  { n: 'RF', m: [9.6, -5.8], a: -40 }, { n: 'RM', m: [0, -8.6], a: -90 }, { n: 'RR', m: [-9.6, -5.8], a: -140 } ];
HX_LEGS.forEach(L => { const a = L.a*DEG, r = HX.COXA + 9.6; L.N = [L.m[0] + r*Math.cos(a), L.m[1] + r*Math.sin(a)]; });
const HX_GAITS = {
  tripod: { label: 'Tripod', duty: .5, off: [0, .5, 0, .5, 0, .5], freq: 1.1, note: 'Three legs up, three down: a stable triangle always under the body. The fastest statically stable gait.' },
  ripple: { label: 'Ripple', duty: 2/3, off: [0, 1/3, 2/3, .5, 5/6, 1/6], freq: .9, note: 'Two legs swing at a time, offset left to right: four feet always down, smoother and stronger.' },
  wave:   { label: 'Wave', duty: 5/6, off: [2/6, 1/6, 0, 5/6, 4/6, 3/6], freq: .75, note: 'One leg at a time, rear to front, left side then right: five feet down, slow but very stable, good for rough ground.' } };
const HX_OCT = [[12, 4], [5, 9.2], [-5, 9.2], [-12, 4], [-12, -4], [-5, -9.2], [5, -9.2], [12, -4]];
const HX_LIM = { g: 55, a: [-60, 95], b: [15, 165] };

const hxRot = (th, v) => [v[0]*Math.cos(th) - v[1]*Math.sin(th), v[0]*Math.sin(th) + v[1]*Math.cos(th)];
const hxBodyW = st => { const l = hxRot(st.th, st.lean); return [st.pos[0] + l[0], st.pos[1] + l[1]]; };
const hxScene = (st, w) => [HX.C + w[0] - st.pos[0], HX.C + w[1] - st.pos[1]];
// leg IK in the body frame (origin on the body axis at femur-axis height)
function hxIK(L, fb){
  const dx = fb[0] - L.m[0], dy = fb[1] - L.m[1], h = fb[2], g = wrap180(Math.atan2(dy, dx)/DEG - L.a), rad = Math.hypot(dx, dy) - HX.COXA, D = Math.hypot(rad, h);
  if (D > HX.FEM + HX.TIB - .15) return { err: 'cannot reach that far' }; if (D < HX.TIB - HX.FEM + .4) return { err: 'foot too close to the body' };
  const al = Math.atan2(h, rad) + Math.acos(clamp((HX.FEM**2 + D*D - HX.TIB**2) / (2*HX.FEM*D), -1, 1));
  const ph = Math.atan2(h - HX.FEM*Math.sin(al), rad - HX.FEM*Math.cos(al)), be = al - ph, ang = [g, al/DEG, be/DEG];
  if (Math.abs(g) > HX_LIM.g) return { err: 'coxa servo at its limit', ang };
  if (ang[1] < HX_LIM.a[0] || ang[1] > HX_LIM.a[1]) return { err: 'femur servo at its limit', ang };
  if (ang[2] < HX_LIM.b[0] || ang[2] > HX_LIM.b[1]) return { err: 'tibia servo at its limit', ang };
  return { ang }; }
function hxFootBody(st, i){ const b = hxBodyW(st), w = st.feet[i], d = hxRot(-st.th, [w[0] - b[0], w[1] - b[1]]); return [d[0], d[1], w[2] - st.zb]; }
function hxSolve(st){ st.legErr = [];
  HX_LEGS.forEach((L, i) => { const r = hxIK(L, hxFootBody(st, i)); if (r.ang && !r.err) st.ang[i] = r.ang; else { st.legErr.push(i); if (r.ang) st.ang[i] = r.ang; } }); }
function hxSupport(st){
  const down = st.feet.map((p, i) => p[2] < .3 ? i : -1).filter(i => i >= 0), pts = down.map(i => st.feet[i].slice(0, 2)), c = hxBodyW(st);
  if (pts.length < 3) return { down, poly: pts, margin: -1 };
  const hl = hull(pts.map(p => p.slice())); let m = Infinity, pos = 0, neg = 0;
  for (let i = 0; i < hl.length; i++){ const a = hl[i], b = hl[(i + 1) % hl.length], ex = b[0] - a[0], ey = b[1] - a[1], l = Math.hypot(ex, ey) || 1;
    const cr = (ex*(c[1] - a[1]) - ey*(c[0] - a[0])) / l; m = Math.min(m, Math.abs(cr)); if (cr > 1e-9) pos++; else if (cr < -1e-9) neg++; }
  const inside = !(pos && neg);
  return { down, poly: hl, margin: inside ? m : -m }; }

function hxDraw(st, m){
  const bw = hxBodyW(st), [bx, by] = hxScene(st, bw), TB = tMul(tTr(bx, by, st.zb), tRz(st.th)), tibAt = ROBOTS.hexapod._step.tibia;
  if (st.mode === 'build' && st.built <= tibAt){ sbFree(); sbPut(qBoxNoPut(TB, [-5, -5, -st.zb], [5, 5, -2.4], matOf('#c9bfa9')), obbT(TB, [-5, -5, -st.zb], [5, 5, -2.4]), { p: null }); }
  // ---- body sandwich: bottom plate, standoffs, battery, UBEC, boards, coxa servos, leads, top plate
  sbGroup('body', TB, [-12, -9.2, -2.4], [12, 9.2, 2.4]);
  sbPart('plates'); qExt(TB, HX_OCT, -2.4, -1.8, ALU, { ax: 'z', w: 1.4 });
  for (const [x, y] of [[7.5, 0], [-7.5, 0], [4, 7], [-4, 7], [4, -7], [-4, -7]]) qCyl(TB, 'z', [x, y], -1.8, 1.8, .35, STEEL, { w: .5, n: 8 });
  sbPart('battery'); qBox(TB, [-6.5, -3, -1.8], [2, 3, -.4], BATT, { w: .8, deco: n => n[2] === 1 ? txT(TB, [-2.2, 0, -.38], [1,0,0], [0,1,0], '2S 5000', 1.3, '#fff') : '' });
  sbPart('ubec'); qBox(TB, [3, -3, -1.8], [6, -1, -1], matOf('#e8c45a'), { w: .6 });
  sbPart('ctrlb'); qBox(TB, [-6, -3.4, .4], [1.5, 3.4, .8], matOf('#2f6fb0'), { w: .7, deco: n => n[2] === 1 ? Array.from({length:9}, (_, k) => line([tAp(TB, [-5.5 + k*.8, 2.6, .82]), tAp(TB, [-5.5 + k*.8, 3.2, .82])], .5)).join('') : '' });
  for (const y of [-3.4, 3.4]) for (let k = 0; k < 2; k++) qCyl(TB, 'z', [-5 + k*5, y*.85], -.4, .4, .3, STEEL, { w: .4, n: 8 });
  sbPart('sbc'); qBox(TB, [2.4, -3, .4], [8.4, 3, .8], PCB, { w: .7 }); qBox(TB, [4.2, -1.2, .8], [6.4, 1.2, 1.3], DARK, { w: .5 }); qBox(TB, [7.2, -2.6, .8], [8.4, -.4, 1.6], STEEL, { w: .5 });
  sbPart('imu'); qBox(TB, [-8.2, -1, .4], [-6.8, 1, .7], PCB, { w: .5 });
  sbPart('leads'); HX_LEGS.forEach((L, i) => { const a = L.a*DEG, s = [L.m[0] - 2.2*Math.cos(a), L.m[1] - 2.2*Math.sin(a)];
    qWire([[s[0], s[1], 1.2], [s[0]*.6, s[1]*.55, 1.4], [-5.2 + i*.75, 3.4*Math.sign(L.m[1]), 1]].map(p => tAp(TB, p)), ['#e2483d', '#f4b829', '#3a3633'][i % 3], .22, { seg: 3 }); });
  sbPart('coxaS'); HX_LEGS.forEach(L => { const Tm = tCat(TB, tTr(L.m[0], L.m[1], 0), tRz(L.a*DEG)); qBox(Tm, [-3.4, -1, -1.8], [.8, 1, 1.6], SERVO, { w: .8, deco: n => n[2] === 1 ? dotAt(tAp(Tm, [-2.4, 0, 1.62]), .3, '#f2efe7', .25) : '' }); });
  sbPart('top'); qExt(TB, HX_OCT, 1.8, 2.4, m, { ax: 'z', cover: true, w: 1.8, capDeco: b => b ? txT(TB, [-3, 0, 2.42], [0,-1,0], [1,0,0], 'HEX-6', 2.6) : '' });
  // ---- head: ultrasonic eyes
  sbFree(); sbPart('head'); qBox(TB, [12, -3, -1.2], [14.6, 3, 1.4], DARK, { w: 1 });
  for (const y of [1.6, -1.6]) qCyl(TB, 'x', [y, .1], 14.6, 15.4, 1, STEEL, { w: .7, deco: () => vis(tAx(TB, 0)) ? `<path d="${pd(on(PX(0), ellUV(0, 0, 1, 1, 12)).map(p => tAp(TB, [15.42, y + p[1]*.7, .1 + p[2]*.7])))}" fill="#3a3633"/>` : '' });
  // ---- legs
  HX_LEGS.forEach((L, i) => { const [g, al, be] = st.ang[i], bad = st.legErr.includes(i);
    const Tc = tCat(TB, tTr(L.m[0], L.m[1], 0), tRz((L.a + g)*DEG)), Tf = tCat(Tc, tTr(HX.COXA, 0, 0), tRy(-al*DEG)), Tk = tMul(Tf, tTr(HX.FEM, 0, 0)), Tt = tMul(Tk, tRy(be*DEG));
    sbPart('cbr'); qCyl(Tc, 'z', [0, 0], -2.8, -2.4, 1.1, HORN, { w: .6 }); qBox(Tc, [-1, -1.4, -3.5], [HX.COXA + 1.3, 1.4, -2.8], ALU, { w: .7 });
    sbPart('femurS'); qBox(Tc, [HX.COXA - 1.2, -1.5, -2.8], [HX.COXA + 1.2, 1.3, 1.3], SERVO, { w: .8 }); qCyl(Tc, 'y', [HX.COXA, 0], 1.3, 1.6, 1.1, HORN, { w: .6 });
    sbPart('femur'); for (const [y0, y1] of [[1.6, 2.05], [-2.05, -1.6]]) qBox(Tf, [-1, y0, -.9], [HX.FEM + .8, y1, .9], ALU, { w: .7 });
    sbPart('tibiaS'); qBox(Tk, [-1.2, -1.5, -1.3], [1.2, 1.3, 2.8], SERVO, { w: .8 }); qCyl(Tk, 'y', [0, 0], 1.3, 1.6, 1.1, HORN, { w: .6 });
    sbPart('tibia'); qRod(tAp(Tt, [.2, 0, 0]), tAp(Tt, [HX.TIB - 1.2, 0, 0]), 1.2, bad ? matOf('#e2483d') : m, { r1: .55, sh: tone, w: 1.1 });
    qBox(Tt, [-.9, 1.6, -1.2], [2.6, 2.0, 1.2], ALU, { w: .6 });

<script>(() => { const fig = document.getElementById("fig"); if (!fig) return;

      const at = g => { const r = g.querySelector("rect"); return r ? [+r.getAttribute("x") + r.getAttribute("width")/2, +r.getAttribute("y")] : [0, 0]; };
      gs.map(g => [g.dataset.t, ...at(g)]).sort((a, b) => ((a[1] > cx) - (b[1] > cx)) || a[2] - b[2]).forEach(([t]) => { if (!num.has(t)) num.set(t, num.size + 1); }); }
